substitutions:
  _REGION: us-central1
  _SERVICE: cs-community
  # Update _APP_URL after the first deploy with your actual Cloud Run URL
  _APP_URL: https://cs-community-placeholder.a.run.app

steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_SERVICE:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_SERVICE:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/$_SERVICE'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE'
      - '--image=gcr.io/$PROJECT_ID/$_SERVICE:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - >-
        --set-secrets=APP_KEY=APP_KEY:latest,DB_URL=DB_URL:latest,FIREBASE_CREDENTIALS=FIREBASE_CREDENTIALS:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,GITHUB_CLIENT_ID=GITHUB_CLIENT_ID:latest,GITHUB_CLIENT_SECRET=GITHUB_CLIENT_SECRET:latest
      - >-
        --set-env-vars=APP_ENV=production,APP_DEBUG=false,FILESYSTEM_DISK=firebase,LOG_CHANNEL=stderr,APP_URL=$_APP_URL,GOOGLE_REDIRECT_URI=$_APP_URL/auth/google/callback,GITHUB_REDIRECT_URI=$_APP_URL/auth/github/callback,FIREBASE_PROJECT_ID=cs-community-631ad,FIREBASE_STORAGE_BUCKET=cs-community-631ad.firebasestorage.app

images:
  - 'gcr.io/$PROJECT_ID/$_SERVICE:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/$_SERVICE:latest'
