name: Content Automation

on:
  schedule:
    # 07:00 UTC = 09:00 SAST (UTC+2) daily.
    # Note: scheduled workflows only run from the default branch, and GitHub may
    # delay them by a few minutes. Use "Run workflow" (workflow_dispatch) for an on-demand run.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (collect + enrich, publish nothing)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: content-automation
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run automation pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          LARAVEL_API_URL: ${{ secrets.LARAVEL_API_URL }}
          LARAVEL_API_TOKEN: ${{ secrets.LARAVEL_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_ITEMS: ${{ vars.MAX_ITEMS }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: npm start

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs-${{ github.run_id }}
          path: automation/logs/
          if-no-files-found: ignore
          retention-days: 14
