; Production PHP tuning. The container's code never changes after build, so PHP can skip
; checking files for modifications on every request.
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1

; Cache resolved file paths longer (Laravel touches many files per request).
realpath_cache_size=4096K
realpath_cache_ttl=600
